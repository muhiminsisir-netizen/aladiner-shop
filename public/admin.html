<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('theme')||'null')||'light'}catch(e){}</script>
<style>
:root{--bg:#f4f5fb;--sf:#fff;--sf2:#eef0f8;--tx:#0f1222;--mu:#687089;--bd:rgba(15,18,34,.09);--pr:#6366f1;--ok:#10b981;--wa:#f59e0b;--dg:#ef4444;--grad:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#ec4899);--sh:0 1px 2px rgba(15,18,34,.05),0 8px 24px rgba(15,18,34,.07)}
[data-theme=dark]{--bg:#0a0c16;--sf:#131729;--sf2:#1b2036;--tx:#eef0ff;--mu:#9aa1bd;--bd:rgba(255,255,255,.09);--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}small{color:var(--mu)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);outline:0;transition:.2s}
select:not([multiple]){appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;box-shadow:0 2px 7px #1018280a}select:not([multiple]):hover{border-color:var(--pr)}select option{background:var(--sf);color:var(--tx)}
.select-ui{position:relative;display:block;width:100%;min-width:0}.select-ui.select-compact{display:inline-flex;width:auto;min-width:145px;vertical-align:middle}.select-native{position:absolute!important;inset:0 auto auto 0!important;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;opacity:0!important;clip:rect(0,0,0,0)!important;clip-path:inset(50%)!important;overflow:hidden!important;white-space:nowrap!important;pointer-events:none!important}
.select-trigger{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--bd);border-radius:12px;background:linear-gradient(145deg,var(--sf),var(--sf2));color:var(--tx);text-align:left;font:inherit;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 3px 10px #1018280e;transition:.18s}.select-trigger:hover{border-color:var(--pr);box-shadow:0 6px 16px #6366f11c}.select-trigger:focus-visible{outline:3px solid #6366f155;outline-offset:2px}.select-trigger:disabled{opacity:.55;cursor:not-allowed}.select-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.select-chevron{flex:none;width:9px;height:9px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg) translateY(-2px);transition:transform .18s}.select-trigger[aria-expanded=true] .select-chevron{transform:rotate(225deg) translate(-1px,-1px)}
.select-menu{position:fixed;z-index:10000;overflow:auto;padding:6px;border:1px solid var(--bd);border-radius:15px;background:color-mix(in srgb,var(--sf) 96%,transparent);backdrop-filter:blur(18px);box-shadow:0 18px 45px #0c142d33;animation:select-in .14s ease-out}.select-menu[hidden]{display:none}.select-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border:0;border-radius:10px;background:transparent;color:var(--tx);font:inherit;font-size:13px;text-align:left;cursor:pointer}.select-option:hover,.select-option:focus-visible{background:var(--sf2);outline:none}.select-option[aria-selected=true]{background:#6366f11c;color:var(--pr);font-weight:700}.select-option:disabled{opacity:.45;cursor:not-allowed}.select-tick{width:17px;flex:none;color:var(--pr);font-size:12px}.select-option-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@keyframes select-in{from{opacity:0;transform:translateY(-4px) scale(.99)}to{opacity:1;transform:none}}
input:focus,select:focus,textarea:focus{border-color:var(--pr);box-shadow:0 0 0 4px rgba(99,102,241,.14)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:12px}label.f>input,label.f>select,label.f>textarea{margin-top:5px;font-weight:400}label.f>.select-ui{margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:12px;border:0;background:var(--grad);color:#fff;font-weight:700;font-size:14px;transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(99,102,241,.35)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.gh{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn.gh:hover{box-shadow:var(--sh)}.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}.btn.dg{background:var(--dg)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:16px}
.err{color:var(--dg)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}#login form{width:100%;max-width:400px}
.logo{font-weight:800;font-size:22px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.admin-brand{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.admin-brand.brand-right{flex-direction:row-reverse;justify-content:flex-end}.admin-brand .brand-mark{width:30px;height:30px;background:color-mix(in srgb,var(--sf) var(--brand-opacity,0%),transparent)}.admin-brand .brand-name{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
#shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
#side{background:var(--sf);border-right:1px solid var(--bd);padding:18px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.nv{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:0;background:none;text-align:left;font-weight:600;color:var(--mu);width:100%;transition:.2s}
.nv:hover{background:var(--sf2);color:var(--tx)}.nv.on{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(99,102,241,.3)}
.sp{flex:1}.main{padding:22px;min-width:0}
.mtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}.mtop h1{margin:0;font-size:26px;letter-spacing:-.5px}
#burger{display:none;border:1px solid var(--bd);background:var(--sf);border-radius:10px;width:40px;height:40px;font-size:20px}
#ov{display:none}
@media(max-width:860px){#shell{grid-template-columns:1fr}#side{position:fixed;left:0;top:0;z-index:60;width:250px;transform:translateX(-105%);transition:.3s}#side.open{transform:none}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}#ov:not([hidden]){display:block}#burger{display:block}.main{padding:14px}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}.stat small{font-weight:600}.stat b{display:block;font-size:24px;letter-spacing:-.5px;margin-top:2px}
.two{display:grid;gap:16px}@media(min-width:1000px){.two{grid-template-columns:1.4fr 1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);text-align:left;padding:8px}td{padding:10px 8px;border-top:1px solid var(--bd);vertical-align:middle}
.wrap{overflow-x:auto}.th{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--sf2);display:block}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sf2)}
.s-Pending,.c-off{background:#fef3c7;color:#92400e}.s-Confirmed{background:#dbeafe;color:#1e40af}.s-Processing{background:#ede9fe;color:#5b21b6}.s-Shipped{background:#cffafe;color:#155e75}.s-Delivered,.c-on{background:#d1fae5;color:#065f46}.s-Cancelled{background:#fee2e2;color:#991b1b}
.ord{border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;background:var(--sf);box-shadow:var(--sh);overflow:hidden}
.oh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--sf2)}
.ob{display:grid;gap:14px;padding:14px 16px}@media(min-width:800px){.ob{grid-template-columns:1fr 1fr}}.ob p{margin:3px 0}
.of{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--bd);align-items:center}.of select,.of input{width:auto;min-width:140px}
.of .select-ui{min-width:140px}
.chart{width:100%;height:auto}.chart text{fill:var(--mu);font-size:10px}
.g2{display:grid;gap:0 12px}@media(min-width:600px){.g2{grid-template-columns:1fr 1fr}.g2 .full{grid-column:1/-1}}
#modal .mb{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:grid;place-items:center;padding:14px;overflow:auto}
#modal .md{background:var(--sf);border-radius:20px;padding:22px;width:100%;max-width:640px;max-height:92vh;overflow:auto;animation:up .25s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.prev img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.bn{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.bn img{width:140px;height:60px;object-fit:cover;border-radius:10px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;animation:up .25s;box-shadow:0 10px 30px rgba(0,0,0,.3)}.toast.err{background:#b91c1c}
.load{padding:40px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<div id="login" hidden><form class="box" id="lf"><div class="logo admin-brand" id="admin-brand-login"><span class="brand-name">Admin Panel</span></div><p><small>Sign in to manage your store</small></p>
  <label class="f">Email<input id="em" type="text" autocomplete="username" required></label>
  <label class="f">Password<input id="pw" type="password" autocomplete="current-password" required></label>
  <button class="btn" style="width:100%">Login</button><p class="err" id="le" role="alert"></p><a href="/"><small>← Back to store</small></a></form></div>

<div id="shell" hidden>
  <aside id="side"><div class="logo admin-brand" id="admin-brand" style="padding:6px 14px 16px"><span class="brand-name">Admin Panel</span></div>
    <button class="nv" data-t="dash">📊 Dashboard</button><button class="nv" data-t="prods">📦 Products</button><button class="nv" data-t="ords">🧾 Orders</button>
    <button class="nv" data-t="custs">👥 Customers</button><button class="nv" data-t="cps">🏷️ Coupons</button><button class="nv" data-t="bns">🖼️ Banners</button><button class="nv" data-t="sets">⚙️ Settings</button>
    <div class="sp"></div><button class="nv" id="th">🌓 Toggle theme</button><a class="nv" href="/" target="_blank">🛍️ View store</a><button class="nv" id="lo">🚪 Logout</button></aside>
  <div id="ov" hidden></div>
  <div class="main"><div class="mtop"><button id="burger" aria-label="Menu">☰</button><h1 id="ttl">Dashboard</h1></div><div id="view"></div></div>
</div>
<div id="toasts" role="status"></div><div id="modal"></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk=n=>'৳'+Number(n||0).toLocaleString('en-IN');
const dt=s=>{const d=new Date(String(s).replace(' ','T')+'Z');return isNaN(d)?'':d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const toast=(m,t='ok')=>{const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200)};
async function api(u,o={}){
  const h={};let b=o.body;
  if(b!==undefined&&!(b instanceof FormData)){h['Content-Type']='application/json';b=JSON.stringify(b)}
  let r;try{r=await fetch(u,{method:o.method||'GET',headers:h,body:b})}catch{throw new Error('Network problem. Please try again.')}
  const d=await r.json().catch(()=>({}));
  if(r.status===401){showLogin()}
  if(!r.ok)throw new Error(d.error||'Something went wrong');return d;
}
const showLogin=()=>{$('#shell').hidden=true;$('#login').hidden=false};
let PL=[],range=7,cur=new URLSearchParams(location.search).has('order')?'ords':'dash',OF={status:'',q:new URLSearchParams(location.search).get('order')||''};
const TABS={dash:['Dashboard',dash],prods:['Products',prods],ords:['Orders',ords],custs:['Customers',custs],cps:['Coupons',cps],bns:['Banners',bns],sets:['Settings',sets]};

$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
  try{await api('/api/login',{method:'POST',body:{email:$('#em').value,password:$('#pw').value}});await init()}catch(er){$('#le').textContent=er.message}};
async function init(){
  const brand=await api('/api/settings').catch(()=>({}));paintAdminBrand(brand);
  const m=await api('/api/me').catch(()=>null);
  if(m&&m.role==='admin'){$('#login').hidden=true;$('#shell').hidden=false;go(cur)}
  else{showLogin();if(m)$('#le').textContent='This account is not an admin. Logout from the store first.'}
}
function paintAdminBrand(s={}){const opacity=Math.max(0,Math.min(100,Number(s.logo_bg_opacity)||0));['#admin-brand','#admin-brand-login'].forEach(q=>{const el=$(q);if(!el)return;el.classList.toggle('brand-right',s.logo_position==='right');el.style.setProperty('--brand-opacity',opacity+'%');el.innerHTML=`${s.logo_url?`<span class="brand-mark"><img src="${esc(s.logo_url)}" alt=""></span>`:''}<span class="brand-name">Admin Panel</span>`})}
$('#lo').onclick=async()=>{await api('/api/logout',{method:'POST'}).catch(()=>{});showLogin()};
$('#th').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',JSON.stringify(t))};
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#ov').hidden=false};
$('#ov').onclick=()=>{$('#side').classList.remove('open');$('#ov').hidden=true};
$$('.nv[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));
async function go(t){
  cur=t;$('#side').classList.remove('open');$('#ov').hidden=true;
  $$('.nv[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('#ttl').textContent=TABS[t][0];
  $('#view').innerHTML='<div class="load">Loading…</div>';
  try{await TABS[t][1]()}catch(e){$('#view').innerHTML=`<div class="box"><p class="err">${esc(e.message)}</p><button class="btn" onclick="go(cur)">Retry</button></div>`}
}
function modal(h){const m=$('#modal');m.innerHTML=`<div class="mb"><div class="md">${h}</div></div>`;m.firstChild.onclick=e=>{if(e.target===m.firstChild)closeM()}}
const closeM=()=>$('#modal').innerHTML='';

// ---------- Dashboard ----------
async function dash(){
  const s=await api('/api/admin/stats?days='+range);
  const mx=Math.max(1,...s.chart.map(x=>x.v)),bw=600/s.chart.length;
  const bars=s.chart.map((x,i)=>{const h=Math.round(x.v/mx*140);return `<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${160-h}" width="${(bw*.7).toFixed(1)}" height="${Math.max(h,x.v?2:0)}" rx="3" fill="url(#g)"><title>${x.d}: ${tk(x.v)} · ${x.c} orders</title></rect>`}).join('');
  $('#view').innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><small>Revenue = all orders except cancelled (includes unpaid Cash on Delivery orders).</small>
   <select id="rg" style="width:auto"><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select></div>
  <div class="stats"><div class="stat"><small>Revenue (${s.days}d)</small><b>${tk(s.rangeRevenue)}</b></div><div class="stat"><small>Orders (${s.days}d)</small><b>${s.rangeOrders}</b></div>
   <div class="stat"><small>Total revenue</small><b>${tk(s.revenue)}</b></div><div class="stat"><small>Awaiting action</small><b style="color:var(--wa)">${s.pending}</b></div>
   <div class="stat"><small>Payments to verify</small><b style="color:var(--wa)">${s.verify}</b></div><div class="stat"><small>Customers</small><b>${s.customers}</b></div><div class="stat"><small>Live products</small><b>${s.products}</b></div></div>
  <div class="two"><div class="box"><b>Sales trend</b><svg class="chart" viewBox="0 0 600 190"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899" stop-opacity=".6"/></linearGradient></defs>${bars}
   <text x="0" y="182">${s.chart[0].d.slice(5)}</text><text x="600" y="182" text-anchor="end">${s.chart[s.chart.length-1].d.slice(5)}</text></svg></div>
  <div class="box"><b>Top products</b>${s.top.map(t=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)"><span>${esc(t.name)}</span><b>${t.q} sold</b></div>`).join('')||'<p><small>No sales in this period.</small></p>'}</div></div>
  <div class="two"><div class="box"><b>Recent orders</b><div class="wrap"><table>${s.recent.map(o=>`<tr><td>${esc(o.id)}<br><small>${esc(dt(o.created))}</small></td><td>${esc(o.name)}</td><td>${tk(o.total)}</td><td><span class="chip s-${o.status}">${o.status}</span></td></tr>`).join('')||'<tr><td><small>No orders yet.</small></td></tr>'}</table></div></div>
  <div class="box"><b>⚠️ Low stock (5 or less)</b>${s.lowStock.map(p=>`<div class="row" style="justify-content:space-between;padding:8px 0;border-top:1px solid var(--bd)"><span>${esc(p.name)}</span><b class="${p.stock?'':'err'}">${p.stock}</b></div>`).join('')||'<p><small>All products are well stocked.</small></p>'}</div></div>`;
  $('#rg').value=range;$('#rg').onchange=e=>{range=+e.target.value;go('dash')};
}

// ---------- Products ----------
async function prods(){
  PL=await api('/api/admin/products');
  $('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><input id="ps" placeholder="Search products…" style="max-width:320px"><span class="sp" style="flex:1"></span><button class="btn" id="pn">+ Add product</button></div><div class="box wrap"><table id="pt"></table></div>`;
  const draw=()=>{const q=$('#ps').value.toLowerCase();
    $('#pt').innerHTML=`<tr><th></th><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr>`+PL.filter(p=>(p.name+p.sku+p.category+p.brand).toLowerCase().includes(q)).map(p=>`<tr>
     <td>${p.image?`<img class="th" src="${esc(p.image)}" alt="">`:'<div class="th"></div>'}</td><td><b>${esc(p.name)}</b><br><small>${esc(p.category)}${p.sku?' · '+esc(p.sku):''}</small></td>
     <td>${tk(p.price)}${p.old_price?`<br><small><s>${tk(p.old_price)}</s></small>`:''}</td><td><input type="number" min="0" value="${p.stock}" data-st="${p.id}" ${p.has_variants?'disabled title="Edit stock by size in the product form"':''} style="width:80px"></td>
     <td><span class="chip ${p.active?'c-on':'c-off'}">${p.active?'Live':'Archived'}</span></td>
     <td><div class="row" style="flex-wrap:nowrap"><button class="btn gh sm" data-e="${p.id}">Edit</button><button class="btn gh sm" data-a="${p.id}">${p.active?'Archive':'Restore'}</button><button class="btn dg sm" data-x="${p.id}">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="6"><small>No products found.</small></td></tr>';
    $$('[data-st]').forEach(i=>i.onchange=async()=>{try{await api('/api/admin/products/'+i.dataset.st+'/stock',{method:'POST',body:{stock:i.value}});toast('Stock updated')}catch(e){toast(e.message,'err')}});
    $$('[data-e]').forEach(b=>b.onclick=()=>pform(PL.find(p=>p.id==b.dataset.e)));
    $$('[data-a]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/products/'+b.dataset.a+'/toggle',{method:'POST'});toast('Updated');prods()}catch(e){toast(e.message,'err')}});
    $$('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this product permanently? Past orders keep their details.'))return;try{await api('/api/admin/products/'+b.dataset.x,{method:'DELETE'});toast('Deleted');prods()}catch(e){toast(e.message,'err')}});
  };
  $('#ps').oninput=draw;$('#pn').onclick=()=>pform(null);draw();
}
function pform(p){
  p=p||{};const cs=[...new Set(PL.map(x=>x.category).filter(Boolean))];
  modal(`<h2 style="margin-top:0">${p.id?'Edit product':'Add product'}</h2><form id="pf" novalidate><div class="g2">
   <label class="f full">Name *<input name="name" value="${esc(p.name)}" maxlength="200"></label>
   <label class="f">Category<input name="category" list="cl" value="${esc(p.category)}"><datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
   <label class="f">Brand<input name="brand" value="${esc(p.brand)}"></label><label class="f">SKU<input name="sku" value="${esc(p.sku)}"></label>
   <label class="f">Stock *<input name="stock" type="number" min="0" step="1" value="${p.stock??''}"></label>
   <label class="f">Selling price (৳) *<input name="price" type="number" min="1" step="0.01" value="${p.price??''}"></label>
   <label class="f">Original price (৳) <small>optional, shows discount</small><input name="old_price" type="number" min="0" step="0.01" value="${p.old_price??''}"></label>
   <label class="f full">Description<textarea name="description">${esc(p.description)}</textarea></label>
   <div class="full"><label class="f">Images <small>up to 6 · JPG/PNG/WebP · max 3MB each · first image is the main image${p.id?' · uploading new images replaces old ones':''}</small><input id="imf" name="images" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
    <div class="prev" id="pv">${(p.gallery||[]).map(s=>`<img src="${esc(s)}" alt="">`).join('')}</div></div></div>
   <p class="err" id="pe" role="alert"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn gh" id="pc">Cancel</button><button class="btn" id="ps2">${p.id?'Save changes':'Create product'}</button></div></form>`);
  $('#pc').onclick=closeM;
  $('#imf').onchange=e=>{const fs=[...e.target.files];if(fs.length>6){e.target.value='';$('#pv').innerHTML='';return $('#pe').textContent='Maximum 6 images allowed'}
    if(fs.some(f=>f.size>3*1024*1024)){e.target.value='';$('#pv').innerHTML='';return $('#pe').textContent='Each image must be under 3MB'}
    $('#pe').textContent='';$('#pv').innerHTML=fs.map(f=>`<img src="${URL.createObjectURL(f)}" alt="">`).join('')};
  $('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target;
    if(!f.name.value.trim())return $('#pe').textContent='Product name is required';
    if(!(+f.price.value>0))return $('#pe').textContent='Enter a valid selling price';
    if(!(f.stock.value!==''&&+f.stock.value>=0))return $('#pe').textContent='Enter a valid stock quantity';
    if(f.old_price.value&&+f.old_price.value<=+f.price.value)return $('#pe').textContent='Original price must be higher than the selling price (or leave empty)';
    $('#ps2').disabled=true;$('#ps2').textContent='Saving…';
    try{await api(p.id?'/api/admin/products/'+p.id:'/api/admin/products',{method:p.id?'PUT':'POST',body:new FormData(f)});closeM();toast('Product saved');prods()}
    catch(er){$('#pe').textContent=er.message;$('#ps2').disabled=false;$('#ps2').textContent='Save'}};
}

// ---------- Orders ----------
async function ords(){
  $('#view').innerHTML=`<div class="row" style="margin-bottom:14px"><input id="oq" placeholder="Search order ID, name, phone…" style="max-width:300px" value="${esc(OF.q)}">
   <select id="os" style="width:auto"><option value="">All statuses</option>${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${OF.status===s?'selected':''}>${s}</option>`).join('')}</select>
   <span style="flex:1"></span><a class="btn gh" id="csv" href="#">⬇ Export CSV</a></div><div id="ol"></div>`;
  let tm;const qs=()=>new URLSearchParams(OF).toString();
  $('#oq').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{OF.q=e.target.value.trim();load()},300)};
  $('#os').onchange=e=>{OF.status=e.target.value;load()};
  $('#csv').onclick=e=>{e.preventDefault();location.href='/api/admin/orders.csv?'+qs()};
  async function load(){
    const list=await api('/api/admin/orders?'+qs());
    $('#ol').innerHTML=list.map(o=>{const fin=['Cancelled','Delivered'].includes(o.status);return `<div class="ord"><div class="oh"><div><b>${esc(o.id)}</b><br><small>${esc(dt(o.created))}</small></div><span class="chip s-${o.status}">${o.status}</span><b>${tk(o.total)}</b></div>
     <div class="ob"><div><small>Customer</small><p><b>${esc(o.name)}</b><br>${esc(o.phone)}${o.email?`<br>${esc(o.email)}`:''}<br>${esc(o.address)}${o.note?`<br><i>Note: ${esc(o.note)}</i>`:''}</p></div>
     <div><small>Items</small><p>${o.items.map(i=>`${esc(i.name)}${i.variant?' · '+esc(i.variant):''} × ${i.qty} — ${tk(i.price*i.qty)}`).join('<br>')}</p><p><small>Subtotal ${tk(o.subtotal)}${o.discount?` · Discount -${tk(o.discount)} (${esc(o.coupon)})`:''} · Shipping ${tk(o.shipping)}</small></p><p><small>Payment: <b>${esc(o.payment)}</b> <span class="chip">${esc(o.payment_status)}</span>${o.trx?' · TrxID <b>'+esc(o.trx)+'</b>':''}${o.guest?' · Guest order':''}</small></p><p><small>Email notification: <b>${esc(o.email_notification.status)}</b>${o.email_notification.attempts?' · attempts '+o.email_notification.attempts:''}${o.email_notification.last_error?' · '+esc(o.email_notification.last_error):''}</small></p></div></div>
     <div class="of"><button class="btn gh sm" data-mail="${esc(o.id)}" ${o.email_notification.status==='Sending'?'disabled':''}>${o.email_notification.status==='Sent'?'Send order email again':o.email_notification.status==='Failed'?'Retry email':'Send order email'}</button><select data-p="${esc(o.id)}">${['Unpaid','Verifying','Paid'].map(s=>`<option ${s===o.payment_status?'selected':''}>${s}</option>`).join('')}</select><button class="btn gh sm" data-pay="${esc(o.id)}">Save payment</button><button class="btn gh sm" data-pr="${esc(o.id)}">🖨 Invoice</button>${fin?`<small>This order is final.${o.tracking?' Tracking: '+esc(o.tracking):''}</small>`:`<select data-s="${esc(o.id)}">${['Pending','Confirmed','Processing','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
      <input data-t="${esc(o.id)}" placeholder="Tracking number" value="${esc(o.tracking||'')}" maxlength="100"><button class="btn sm" data-save="${esc(o.id)}">Update</button>`}</div></div>`}).join('')||'<div class="box"><small>No orders found.</small></div>';
    $$('[data-pay]').forEach(b=>b.onclick=async()=>{const id=b.dataset.pay;try{await api('/api/admin/orders/'+encodeURIComponent(id),{method:'POST',body:{payment_status:$(`[data-p="${CSS.escape(id)}"]`).value}});toast('Payment updated');load()}catch(e){toast(e.message,'err')}});
    $$('[data-mail]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/admin/orders/'+encodeURIComponent(b.dataset.mail)+'/email',{method:'POST',body:{}});toast('Order email queued');setTimeout(load,500)}catch(e){toast(e.message,'err');b.disabled=false}});
    $$('[data-pr]').forEach(b=>b.onclick=()=>invoice(list.find(o=>o.id===b.dataset.pr)));
    $$('[data-save]').forEach(b=>b.onclick=async()=>{
      const id=b.dataset.save,sel=$(`[data-s="${CSS.escape(id)}"]`),status=sel.value,tr=$(`[data-t="${CSS.escape(id)}"]`).value;
      if(status==='Cancelled'&&!confirm('Cancel this order? Stock will be returned and this cannot be undone.'))return;
      if(status==='Delivered'&&!confirm('Mark as Delivered? This is final.'))return;
      b.disabled=true;try{await api('/api/admin/orders/'+encodeURIComponent(id),{method:'POST',body:{status,tracking:tr}});toast('Order updated');load()}catch(e){toast(e.message,'err');b.disabled=false}});
  }
  await load();
}

// ---------- Settings ----------
async function sets(){
  const s=await fetch('/api/settings').then(r=>r.json());
  const mail=await api('/api/admin/order-email');
  paintAdminBrand(s);
  const F=(k,l,type='text',h='')=>`<label class="f">${l}${h?` <small>${h}</small>`:''}<input name="${k}" type="${type}" value="${esc(s[k])}"></label>`;
  const T=(k,l)=>`<label class="f full">${l}<textarea name="${k}">${esc(s[k])}</textarea></label>`;
  $('#view').innerHTML=`<form class="box" id="sf" novalidate><div class="g2">
   ${F('store_name','Store name')}${F('announcement','Announcement bar text','text','leave empty to hide')}
   ${F('ship_dhaka','Delivery charge: Inside Dhaka (৳)','number')}${F('ship_outside','Delivery charge: Outside Dhaka (৳)','number')}
   ${F('free_ship','Free delivery above (৳)','number','0 = disabled')}${F('phone','Phone')}${F('whatsapp','WhatsApp number','text','with country code, e.g. 8801XXXXXXXXX')}
   ${F('facebook','Facebook page link','url','https://…')}${F('instagram','Instagram link','url','https://…')}${F('hours','Business hours')}
   <label class="f full">Address<input name="address" value="${esc(s.address)}"></label>
   ${T('about','About Us')}${T('shipping_policy','Shipping policy')}${T('return_policy','Return & refund policy')}${T('privacy','Privacy policy')}${T('terms','Terms & conditions')}</div>
   <button class="btn">Save settings</button> <span class="err" id="se"></span></form>
  <form class="box" id="oef" novalidate><h3>Order Email Notifications</h3><p><small>SMTP configuration: <b>${mail.smtpConfigured?'Configured':'Missing or invalid'}</b> · Notifications: <b>${mail.enabled?'Enabled':'Disabled'}</b>${!mail.publicUrlConfigured?' · PUBLIC_URL not set (email links will use localhost)':''}</small></p><label class="f">Recipient email<input type="email" name="recipient" value="${esc(mail.recipient)}" placeholder="orders@example.com" autocomplete="email" required></label><label class="row" style="gap:8px;margin:8px 0 14px"><input type="checkbox" name="enabled" style="width:auto" ${mail.enabled?'checked':''}><b>Enable new order email notifications</b></label><button class="btn">Save email settings</button> <button class="btn gh" type="button" id="oetest" ${!mail.smtpConfigured||!mail.recipient||!mail.enabled?'disabled':''}>Send Test Email</button> <span class="err" id="oee" role="status"></span></form>
  <form class="box" id="pwf" novalidate><b>Change admin password</b><div class="g2" style="margin-top:10px"><label class="f">Current password<input name="current" type="password" autocomplete="current-password"></label><label class="f">New password <small>min 14 characters</small><input name="next" type="password" autocomplete="new-password"></label></div><button class="btn">Change password</button> <span class="err" id="pe2"></span></form>
  <form class="box" id="brandf" novalidate><h3>Website & Admin Logo</h3><p><small>এই section থেকে logo সরাসরি upload ও apply হবে; মূল Settings-এর Save button আর চাপতে হবে না। JPG, PNG বা WebP; সর্বোচ্চ 3MB।</small></p><div class="row" style="align-items:center;gap:18px;flex-wrap:wrap"><label class="f" style="min-width:230px;flex:1">Logo image<input id="brand-file" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="brand-preview" class="admin-brand ${s.logo_position==='right'?'brand-right':''}" style="--brand-opacity:${Math.max(0,Math.min(100,Number(s.logo_bg_opacity)||0))}%">${s.logo_url?`<span class="brand-mark"><img src="${esc(s.logo_url)}" alt=""></span>`:''}<span class="brand-name">Admin Panel</span></div></div><div class="g2" style="margin-top:8px"><label class="f">Logo position<select name="logo_position"><option value="left" ${s.logo_position!=='right'?'selected':''}>Left of the name</option><option value="right" ${s.logo_position==='right'?'selected':''}>Right of the name</option></select></label><label class="f">Logo background opacity: <output id="logo-opacity-value">${Math.max(0,Math.min(100,Number(s.logo_bg_opacity)||0))}%</output><input id="logo-opacity" name="logo_bg_opacity" type="range" min="0" max="100" step="1" value="${Math.max(0,Math.min(100,Number(s.logo_bg_opacity)||0))}"></label></div><button class="btn" type="button" id="brand-upload">Upload & Apply Logo</button> <button class="btn gh" type="submit">Save logo position & background</button> <span id="brand-msg" class="err" role="status"></span></form>`;
  $('#pwf').onsubmit=async e=>{e.preventDefault();const f=e.target;$('#pe2').textContent='';try{await api('/api/admin/password',{method:'POST',body:{current:f.elements.current.value,next:f.elements.next.value}});toast('Password changed');f.reset()}catch(er){$('#pe2').textContent=er.message}};
  const paintLogoPreview=(url,position,opacity)=>{const preview=$('#brand-preview');preview.classList.toggle('brand-right',position==='right');preview.style.setProperty('--brand-opacity',Math.max(0,Math.min(100,+opacity||0))+'%');preview.innerHTML=`${url?`<span class="brand-mark"><img src="${esc(url)}" alt=""></span>`:''}<span class="brand-name">Admin Panel</span>`;paintAdminBrand({...s,logo_url:url,logo_position:position,logo_bg_opacity:opacity})};
  const logoError=er=>er.message==='Not found'?'এই server-এ logo upload route পাওয়া যায়নি। Server বন্ধ করে project folder থেকে npm start চালান, তারপর Ctrl+F5 দিন।':er.message;
  $('#brand-upload').onclick=async()=>{const file=$('#brand-file').files[0],msg=$('#brand-msg'),button=$('#brand-upload');msg.textContent='';if(!file){msg.textContent='আগে একটি logo image বেছে নিন।';return}const fd=new FormData();fd.append('intent','upload');fd.append('image',file);fd.append('logo_position',$('[name=logo_position]').value);fd.append('logo_bg_opacity',$('#logo-opacity').value);button.disabled=true;try{const r=await api('/api/admin/logo',{method:'POST',body:fd});paintLogoPreview(r.url,r.logo_position,r.logo_bg_opacity);$('#brand-file').value='';msg.className='okt';msg.textContent='Logo সফলভাবে upload ও apply হয়েছে। Storefront-এ Ctrl+F5 দিন।'}catch(er){msg.className='err';msg.textContent=logoError(er)}finally{button.disabled=false}};
  $('#brandf').onsubmit=async e=>{e.preventDefault();const msg=$('#brand-msg'),button=$('[type=submit]',e.target),fd=new FormData();fd.append('intent','settings');fd.append('logo_position',$('[name=logo_position]').value);fd.append('logo_bg_opacity',$('#logo-opacity').value);msg.textContent='';button.disabled=true;try{const r=await api('/api/admin/logo',{method:'POST',body:fd});paintLogoPreview(r.url,r.logo_position,r.logo_bg_opacity);msg.className='okt';msg.textContent='Logo display settings saved.'}catch(er){msg.className='err';msg.textContent=logoError(er)}finally{button.disabled=false}};
  $('#logo-opacity').oninput=e=>{const v=Math.max(0,Math.min(100,+e.target.value||0));$('#logo-opacity-value').value=v+'%';$('#brand-preview').style.setProperty('--brand-opacity',v+'%')};
  $('[name=logo_position]').onchange=e=>$('#brand-preview').classList.toggle('brand-right',e.target.value==='right');
  $('#oef').onsubmit=async e=>{e.preventDefault();$('#oee').textContent='';const f=e.target;try{await api('/api/admin/order-email',{method:'POST',body:{recipient:f.elements.recipient.value,enabled:f.elements.enabled.checked}});toast('Order email settings saved');sets()}catch(er){$('#oee').textContent=er.message}};
  $('#oetest').onclick=async()=>{const b=$('#oetest');b.disabled=true;$('#oee').textContent='Sending test…';try{const r=await api('/api/admin/order-email/test',{method:'POST',body:{}});$('#oee').textContent=r.message;$('#oee').className='okt';b.disabled=false}catch(er){$('#oee').textContent=er.message;$('#oee').className='err';b.disabled=false}};
  $('#sf').onsubmit=async e=>{e.preventDefault();$('#se').textContent='';
    try{await api('/api/admin/settings',{method:'POST',body:Object.fromEntries(new FormData(e.target))});toast('Settings saved');sets()}catch(er){$('#se').textContent=er.message}};
}
function invoice(o){const w=window.open('','_blank');if(!w)return toast('Allow popups to print','err');
w.document.write(`<meta charset="utf-8"><title>${esc(o.id)}</title><body style="font-family:sans-serif;max-width:680px;margin:24px auto;color:#111"><h2>Invoice ${esc(o.id)}</h2><p>${esc(dt(o.created))}<br><b>${esc(o.name)}</b> · ${esc(o.phone)}<br>${esc(o.address)}</p><table style="width:100%;border-collapse:collapse">${o.items.map(i=>`<tr><td style="padding:6px 0;border-bottom:1px solid #ddd">${esc(i.name)} × ${i.qty}</td><td style="text-align:right;border-bottom:1px solid #ddd">${tk(i.price*i.qty)}</td></tr>`).join('')}</table><p style="text-align:right">Subtotal ${tk(o.subtotal)}<br>${o.discount?'Discount -'+tk(o.discount)+'<br>':''}Delivery ${tk(o.shipping)}<br><b style="font-size:20px">Total ${tk(o.total)}</b><br>${esc(o.payment)} · ${esc(o.payment_status)}</p>`);w.document.close();w.focus();w.print()}
