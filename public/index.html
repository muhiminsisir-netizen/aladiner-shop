<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Shop</title>
<meta name="theme-color" content="#6366f1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('theme')||'null')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-truck" viewBox="0 0 24 24"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
<symbol id="i-headset" viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
<symbol id="i-filter" viewBox="0 0 24 24"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
</svg>

<div id="announce" hidden></div>
<header class="hdr" id="hdr">
  <div class="top">
    <a class="logo sname" href="#/" id="logo">My Shop</a>
    <div class="search">
      <svg class="ic si"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search products, brand, SKU…" aria-label="Search products" autocomplete="off">
      <button id="sclear" hidden aria-label="Clear search"><svg class="ic"><use href="#i-x"/></svg></button>
      <div id="sug" hidden></div>
    </div>
    <button class="ib" id="theme" aria-label="Toggle dark mode"><svg class="ic tg"><use href="#i-moon"/></svg></button>
    <a class="ib dm" href="#/wishlist" aria-label="Wishlist"><svg class="ic"><use href="#i-heart"/></svg><span class="nb wc" hidden>0</span></a>
    <a class="ib dm" href="#/login" id="acct" aria-label="Account"><svg class="ic"><use href="#i-user"/></svg></a>
    <a class="ib" href="#/cart" aria-label="Cart"><svg class="ic"><use href="#i-cart"/></svg><span class="nb cc" hidden>0</span></a>
  </div>
  <nav id="cats" aria-label="Categories"></nav>
</header>

<main id="app"></main>
<footer id="foot"></footer>

<nav class="bnav" aria-label="Mobile navigation">
  <a href="#/" data-r="home"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
  <a href="#/shop" data-r="shop"><svg class="ic"><use href="#i-grid"/></svg><span>Shop</span></a>
  <a href="#/wishlist" data-r="wishlist"><svg class="ic"><use href="#i-heart"/></svg><span>Wishlist</span><i class="nb wc" hidden>0</i></a>
  <a href="#/cart" data-r="cart"><svg class="ic"><use href="#i-cart"/></svg><span>Cart</span><i class="nb cc" hidden>0</i></a>
  <a href="#/login" data-r="account" id="acct2"><svg class="ic"><use href="#i-user"/></svg><span>Account</span></a>
</nav>
<button id="up" aria-label="Back to top" hidden><svg class="ic"><use href="#i-up"/></svg></button>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
